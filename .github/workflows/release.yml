name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0 or v0.1.0-beta.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  APP_NAME: rss-cli

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Select release tag
        id: release-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$PUSH_TAG"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH[-PRERELEASE]: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify tag exists on the repository
        env:
          TAG: ${{ steps.release-tag.outputs.tag }}
        run: git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}.git" "refs/tags/$TAG"

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go test ./...
      - run: go build ./cmd/rss-cli

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [validate, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          git_hash="$(git rev-parse --short HEAD)"
          suffix="${GOOS}_${GOARCH}"
          if [ -n "${GOARM:-}" ]; then
            suffix="${suffix}v${GOARM}"
          fi
          archive="${APP_NAME}_${version}_${suffix}"
          mkdir -p dist
          ext=""
          if [ "$GOOS" = windows ]; then ext=.exe; fi
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X github.com/infituit/rss-cli/pkg/version.VERSION=$TAG -X github.com/infituit/rss-cli/pkg/version.GITHASH=$git_hash" \
            -o "dist/${APP_NAME}${ext}" ./cmd/rss-cli
          if [ "$GOOS" = windows ]; then
            (cd dist && zip "../${archive}.zip" "${APP_NAME}.exe")
          else
            tar -C dist -czf "${archive}.tar.gz" "${APP_NAME}"
          fi
          rm -rf dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: "*.tar.gz"
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}-zip
          path: "*.zip"
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create checksums
        run: sha256sum *.tar.gz *.zip > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            *.tar.gz *.zip checksums.txt
