services:
  freshrss:
    image: freshrss/freshrss:1.27.0
    environment:
      TZ: UTC
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url ${FRESHRSS_TEST_BASE_URL}
        --db-type sqlite
        --default-user freshrss
        --language en
      FRESHRSS_USER: |-
        --api-password ${FRESHRSS_TEST_API_PASSWORD}
        --email freshrss@example.test
        --language en
        --password ${FRESHRSS_TEST_WEB_PASSWORD}
        --user freshrss
    ports:
      - "127.0.0.1:${FRESHRSS_TEST_PORT}:80"
    healthcheck:
      test: ["CMD", "cli/health.php"]
      timeout: 10s
      start_period: 60s
      interval: 10s
      retries: 12
